    <p>Eksempel Konsult AS ble stiftet i 2012 og har i dag 42 ansatte. Vi leverer rådgivning om ledelse til bedrifter i hele Norge.</p>
    <p>Vi tror at gode beslutninger er den viktigste forutsetningen for en lønnsom bedrift, og det er det vi er opptatt av hver dag.</p>
